services:
  # Nuxt is the only startup dependency of the disposable ingress.
  nuxt:
    image: python:3.12-alpine
    command: ["python", "/opt/stub_upstream.py", "--port", "3000", "--role", "nuxt"]
    volumes:
      - type: bind
        source: ../../../tests/launch_safety/harness/stub_upstream.py
        target: /opt/stub_upstream.py
        read_only: true
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 15

  # These services intentionally have no host publication and are optional.
  # The Nginx resolver must not require them during a closed startup.
  agent:
    profiles: ["optional-upstreams"]
    image: python:3.12-alpine
    command: ["python", "/opt/stub_upstream.py", "--port", "8360", "--role", "agent"]
    volumes:
      - type: bind
        source: ../../../tests/launch_safety/harness/stub_upstream.py
        target: /opt/stub_upstream.py
        read_only: true
    expose:
      - "8360"

  bot-gateway:
    profiles: ["optional-upstreams"]
    image: python:3.12-alpine
    command: ["python", "/opt/stub_upstream.py", "--port", "8361", "--role", "bot"]
    volumes:
      - type: bind
        source: ../../../tests/launch_safety/harness/stub_upstream.py
        target: /opt/stub_upstream.py
        read_only: true
    expose:
      - "8361"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      nuxt:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - type: bind
        source: ../../../nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${VL360_MAINTENANCE_RUNTIME:-../../../ops/nginx/maintenance}
        target: /etc/nginx/vl360-maintenance
        read_only: true
