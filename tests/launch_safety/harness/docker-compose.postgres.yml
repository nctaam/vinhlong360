services:
  sitemap-bundle-postgres:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_USER: vl360
      POSTGRES_PASSWORD: vl360_launch_test
      POSTGRES_DB: vl360_launch_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vl360 -d vl360_launch_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
