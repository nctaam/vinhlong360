# ──────────────────────────────────────────────────────────────
# vinhlong360 — Continuous Integration
#
# Runs on every push to main and on pull requests.
# Jobs: lint, test, docker build verification, secret scanning.
# ──────────────────────────────────────────────────────────────

name: CI

on:
  push:
    # MỌI nhánh, không riêng main. Trước 2026-08-06 chỉ `main` và PR mới kích CI,
    # nên nhánh phát triển chạy hàng tuần mà không ai kiểm: lần chạy đầu sau 4
    # tuần backlog lộ 254 test đỏ cùng lúc — không cái nào là hồi quy mới, chúng
    # chỉ chưa từng được chạy. Trả giá bằng vài phút runner mỗi push rẻ hơn nhiều
    # so với gỡ một đống nợ tích luỹ.
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint ────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Check for style violations (non-zero exit = failure)
      - name: Run ruff check
        run: ruff check agent/ scripts/ tests/ --output-format=github

      # NOTE: `ruff format --check` cố tình KHÔNG chạy. Dự án dùng ruff làm LINTER
      # (E/F/W/ASYNC) với style compact chủ đích (ignore E501/E701/E741) — ruff-format
      # default sẽ nổ import + reflow 88-col, phá style. Format-policy = ruff-lint-only.

  # ── 2. Test ────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache pip packages between runs to speed up installs
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-timeout
          # ruff là công cụ đo của R20.1/R20.2 trong `run_hard --all` ở bước
          # "Enforce standards" bên dưới. Job này trước đây không cài ruff, nên
          # hai cổng hard-ratchet đó im lặng trả 0 — tức chưa từng chạy trong CI.
          pip install ruff

      # `install_closed_release.sh` chạy live-mode (không --local-rehearsal) sẽ
      # fallback về /usr/bin/python3, và guard runtime của nó đòi `import ssl` +
      # `dotenv.parser`. `pip` ở trên cài vào Python của setup-python, KHÔNG chạm
      # system Python. Lưu ý: đây KHÔNG phải nguyên nhân đợt đỏ 2026-08-06 (cái
      # đó là `env --argv0`, xem tests/launch_safety/test_installer_portability.py)
      # — giữ lại vì nhánh live-mode vẫn cần, không phải vì nó sửa được nhóm đó.
      - name: Provision system Python for installer contract tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-dotenv

      # Ba test gọi Node để soi AST: tests/helpers/noindex_ast_guard.cjs require
      # `<cwd>/node_modules/typescript`, còn test_route_manifest_parity chạy
      # `vite-node`. Job này chưa từng dựng node_modules nên cả ba chết bằng
      # MODULE_NOT_FOUND — ở local chúng xanh chỉ vì máy dev đã `npm install`.
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-nuxt/package-lock.json

      - name: Install web-nuxt deps for AST/parity tests
        working-directory: web-nuxt
        run: npm ci --no-audit --no-fund

      - name: Run tests with coverage
        env:
          # Dummy values so modules that read env vars at import time
          # don't crash.  No real API calls are made during tests.
          LLM_API_KEY: "test-ci-key"
          LLM_BASE_URL: "http://localhost:9999/v1"
          LLM_MODEL: "test-model"
          LLM_MODEL_MINI: "test-model-mini"
          ADMIN_API_KEY: "test-admin-key"
          CORS_ORIGINS: "http://localhost:8360"
          DESTRUCTIVE_OPS_LOCKED: "1"
        run: |
          # Chạy CẢ tests/ và agent/tests/; bao gồm integration (chỉ loại 'slow').
          # `python -m` chèn cwd vào sys.path — `pytest` trần thì KHÔNG, nên
          # `from scripts.package_launch_release import ...` vỡ ngay ở bước collect
          # (scripts/ không có __init__.py). Bước release-gate phía dưới đã dùng
          # đúng cách này từ trước; CI run 31068058171 là lần đầu lộ ra.
          python -m pytest tests/ agent/tests/ \
            -m "not slow" \
            -v \
            --tb=short \
            --cov=agent \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json

      - name: Enforce standards and coverage ratchet
        run: python scripts/checks/run_hard.py --all

      - name: Validate data.json
        run: python scripts/validate_data.py

      # Upload the coverage report as a build artifact
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
          retention-days: 14

  # Task 45 unit/static contracts use Windows command stubs and must run
  # without provisioning Docker, Chrome, or a Nuxt preview process.
  launch-safety-contracts:
    name: Launch safety contracts (Task 45)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install contract test dependencies
        run: python -m pip install pytest -r requirements-dev.txt

      - name: Run Task 45 Python contracts
        run: python -m pytest tests/launch_safety/test_backend_regression_runner.py tests/launch_safety/test_evidence_record.py tests/launch_safety/test_browser_probe_contract.py tests/launch_safety/test_launch_matrix_contract.py -q

      - name: Run PowerShell release-gate contract
        shell: pwsh
        run: |
          $powershell = Get-Command pwsh,powershell -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $powershell) { throw 'pwsh or powershell is required' }
          & $powershell.Source -NoProfile -File tests/launch_safety/powershell/test_release_gate_harness.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ── 2b. Test on Postgres (UGC/auth prod-parity) ─────────────
  # Job RIÊNG: chạy suite với DATABASE_URL=postgres → bật các test UGC/auth
  # đang skip trên SQLite (Postgres-only). Job `test` ở trên vẫn chạy SQLite
  # (nhanh, ổn định). Prod dùng Postgres cho CẢ entity lẫn UGC → đây là parity thật.
  test-pg:
    name: Test (Postgres — UGC/auth)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vl360
          POSTGRES_PASSWORD: vl360
          POSTGRES_DB: vinhlong360
        ports:
          - 5432:5432
        # Chờ Postgres sẵn sàng trước khi bước test chạy
        options: >-
          --health-cmd "pg_isready -U vl360 -d vinhlong360"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vl360:vl360@localhost:5432/vinhlong360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-timeout

      # Cùng lý do với job `test`: installer contract test gọi system Python,
      # nơi `pip install` ở trên không với tới. Xem chú thích đầy đủ ở job đó.
      - name: Provision system Python for installer contract tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-dotenv

      # Cũng cùng lý do với job `test`: test soi AST và test route-manifest gọi
      # Node vào web-nuxt/node_modules (typescript, vite-node). Bản vá 8321b430
      # mới chỉ thêm cho job kia nên job này vẫn MODULE_NOT_FOUND.
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-nuxt/package-lock.json

      - name: Install web-nuxt deps for AST/parity tests
        working-directory: web-nuxt
        run: npm ci --no-audit --no-fund

      # init.sql (baseline) + agent/migrations/*.sql lên Postgres CI trống.
      - name: Apply schema + migrations
        run: python scripts/apply_migrations.py --init-baseline

      - name: Seed knowledge data in disposable Postgres
        env:
          DESTRUCTIVE_OPS_LOCKED: "0"
          ALLOW_DESTRUCTIVE_DB_REPLACE: "1"
        run: python agent/database.py --replace

      - name: Run tests against Postgres (prod-parity)
        env:
          # Dummy để module đọc env lúc import không crash (không gọi API thật).
          LLM_API_KEY: "test-ci-key"
          LLM_BASE_URL: "http://localhost:9999/v1"
          LLM_MODEL: "test-model"
          LLM_MODEL_MINI: "test-model-mini"
          ADMIN_API_KEY: "test-admin-key"
          CORS_ORIGINS: "http://localhost:8360"
          DESTRUCTIVE_OPS_LOCKED: "1"
        run: |
          # DATABASE_URL=postgres → db._use_pg=True → các test @pg_only chạy (không skip).
          # `python -m` bắt buộc, cùng lý do với job test ở trên: `pytest` trần không
          # chèn cwd vào sys.path nên 8 file launch_safety vỡ ở bước collect.
          python -m pytest tests/ agent/tests/ \
            -m "not slow" \
            --tb=short

  # ── 3. Data coverage (informational, non-blocking) ──────────
  # Prints the % of entities (overall + per type) carrying real photos,
  # summaries, external sources, coordinates, placeId and area. This step
  # never fails the build — coverage_report.py always exits 0, and the job
  # is marked continue-on-error so a transient hiccup cannot gate CI.
  coverage:
    name: Data coverage report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # coverage_report.py is pure stdlib — no pip install required.
      - name: Generate coverage report
        run: |
          python scripts/coverage_report.py --json > coverage-metrics.json
          python scripts/coverage_report.py

      - name: Upload coverage metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-coverage-report
          path: coverage-metrics.json
          retention-days: 30

  # ── 4. Frontend ─────────────────────────────────────────────
  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-nuxt
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # tri-region-color-contract khoá package.json/package-lock.json bằng
          # `git show <commit>:...`, nên clone nông mặc định (depth 1) làm nó vỡ:
          # "Command failed: git show 358fe697:web-nuxt/package.json".
          # Cùng lý do job secret scan đã dùng fetch-depth: 0.
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web-nuxt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: npm run build

      # R30.7 chỉ đo được khi ĐÃ có web-nuxt/.output. `run_hard.py --all` chạy ở
      # job Python — nơi frontend chưa từng build — nên ở đó cổng luôn graceful-skip
      # về 0 và không bao giờ chặn được gì. Đây là nơi duy nhất nó có răng.
      - name: Bundle budget gate (R30.7)
        working-directory: .
        env:
          PYTHONPATH: scripts
        run: python3 -m checks.check_bundle

      - name: Run tests
        run: npm test

      # R30.6 cần axe-report.json, mà trước 2026-08-05 KHÔNG nơi nào trong repo
      # sinh ra nó — cổng hard-ratchet đó chưa bao giờ chạy. Quét bằng CDP thuần
      # (scripts/axe_scan.mjs) trên Chrome có sẵn của runner: không thêm
      # puppeteer/playwright, không tải browser riêng.
      - name: Start preview server for a11y scan
        run: |
          npm run preview &
          echo "PREVIEW_PID=$!" >> $GITHUB_ENV
        env:
          NUXT_PUBLIC_SITE_NOINDEX: "true"

      - name: Accessibility scan (axe-core, 14 trang)
        working-directory: .
        run: node scripts/axe_scan.mjs
        env:
          AXE_BASE_URL: http://localhost:3000

      - name: Accessibility gate (R30.6)
        working-directory: .
        env:
          PYTHONPATH: scripts
        run: python3 -m checks.check_axe

      - name: Stop preview server
        if: always()
        run: kill "$PREVIEW_PID" 2>/dev/null || true

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: axe-report.json
          retention-days: 14

  # ── 5. Docker build (agent) ──────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Buildx gives us layer caching and multi-platform support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only -- do NOT push.  This verifies the Dockerfile
      # produces a valid image without publishing anything.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vinhlong360-agent:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 6. Security — secret scanning ─────────────────────────
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for diff-based scanning

      # TruffleHog scans the entire git history for leaked secrets
      # (API keys, tokens, passwords).  Fails the build if any are found.
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          # Ghim THẬT phiên bản binary. Tag của action (@v3.95.9) KHÔNG ghim nó:
          # input `version` mặc định là `latest`, action dựng ${IMAGE}:${VERSION}
          # nên runner kéo `latest` — log ngày 2026-08-07 chạy 3.96.0 chứ không
          # phải 3.95.9. Nghĩa là một bản latest mới có thể đổi hành vi detector
          # giữa chừng mà không ai đổi một dòng nào ở đây.
          version: v3.96.0
          # --exclude-detectors=Lob: 43 kết quả "verified Lob" đều là DƯƠNG TÍNH GIẢ.
          # Hai lý do độc lập, cả hai đã đo:
          #   1. keyPat của detector là \b((live|test)_[a-zA-Z0-9_]{35})\b, KHÔNG có
          #      kiểm entropy. Toàn bộ 182 chuỗi khớp trong cây đều bắt đầu bằng
          #      `test_` và đều là tên hàm pytest (`def <tên>(`), dài đúng 40 ký tự.
          #      Không có chuỗi `live_` nào. Dự án cũng không dùng dịch vụ Lob.
          #   2. Bước "verify" của detector hỏng: gọi API với User-Agent "TruffleHog"
          #      trả 403 kể cả khi KHÔNG gửi credential nào, và detector coi 403 là
          #      hợp lệ. Tức "verified" ở đây không chứng minh được điều gì.
          # Chỉ tắt ĐÚNG detector này, không nới --only-verified và không tắt
          # detector nào khác (AWS/GitHub/Postgres/OpenAI… vẫn chặn như cũ).
          extra_args: --only-verified --exclude-detectors=Lob

  # ── 7. Frontend typecheck (BLOCKING gate) ─────
  # Runs `nuxt typecheck` (vue-tsc). Type-error backlog driven to 0, so this is now
  # a real gate (continue-on-error removed). Catches the "missing composable /
  # undefined → SSR 500" class (e.g. the /danh-ba, /theo-mua regression) that
  # `npm run build` did not — plus null-safety and route/type drift.
  typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-nuxt
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web-nuxt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run nuxt typecheck
        run: npm run typecheck

  # ── 8. Infrastructure validation ────────────────────────────
  infra:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # docker-compose.yml khai env_file: .env → `docker compose config` cần file .env
      # tồn tại (dù rỗng giá trị). CI không có .env thật (gitignored) → tạo từ template.
      - name: Create .env for compose validation
        run: cp .env.example .env

      - name: Validate docker-compose.yml syntax
        run: docker compose config -q

      - name: Validate docker-compose.prod.yml syntax
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: Check for hardcoded secrets in scripts (informational)
        continue-on-error: true
        run: |
          echo "::notice::Scanning scripts/ for potential hardcoded secrets..."
          grep -rn "password\|secret\|api_key" scripts/ --include="*.py" -i || echo "No matches found."

  # ── 9. Lighthouse CI (placeholder) ─────────────────────────
  # TODO: Enable when a staging URL is available.
  # Lighthouse needs a running server to audit; until CI can spin up
  # the full stack (or we point at a staging URL), this is a placeholder.
  #
  # lighthouse:
  #   name: Lighthouse audit
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   needs: [frontend]
  #   continue-on-error: true
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: treosh/lighthouse-ci-action@v12
  #       with:
  #         urls: https://vinhlong360.vn
  #         uploadArtifacts: true

  # ── 10. Dependency CVE scan (informational, non-blocking) ───
  # Scans Python (pip-audit) and Node (npm audit) deps for known CVEs.
  # NON-BLOCKING: upstream advisories can land on unrelated PRs, so this
  # reports rather than gates. Complements the verified-secret scan above.
  deps-audit:
    name: Dependency CVE scan (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (Python deps)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web-nuxt/package-lock.json

      - name: npm audit (Node deps, high+)
        working-directory: web-nuxt
        run: npm audit --audit-level=high
