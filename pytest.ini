[pytest]
addopts = --import-mode=importlib -m "not slow and not integration and not entity_status_postgres"
testpaths = tests agent/tests
python_files = test_*.py
# Deadlock guard (pytest-timeout): generous per-test ceiling — the slowest healthy
# test spawns pwsh with a 120s subprocess timeout. "thread" dumps every thread's
# stack before aborting, so a hang leaves evidence instead of blocking CI forever.
timeout = 300
timeout_method = thread
markers =
    slow: long-running quality/retrieval tests that are not part of the default unit baseline
    integration: FastAPI/TestClient or service-level integration tests
    entity_status_postgres: requires ENTITY_STATUS_TEST_DATABASE_URL and ENTITY_STATUS_TEST_CONFIRM=disposable
