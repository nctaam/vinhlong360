[pytest]
addopts = --import-mode=importlib -m "not slow and not integration and not entity_status_postgres and not subprocess_heavy"
testpaths = tests agent/tests
python_files = test_*.py
# Deadlock guard (pytest-timeout): generous per-test ceiling — the slowest healthy
# test spawns pwsh with a 120s subprocess timeout. "thread" dumps every thread's
# stack before aborting, so a hang leaves evidence instead of blocking CI forever.
timeout = 300
timeout_method = thread
markers =
    slow: long-running quality/retrieval tests that are not part of the default unit baseline
    integration: FastAPI/TestClient or service-level integration tests
    entity_status_postgres: requires ENTITY_STATUS_TEST_DATABASE_URL and ENTITY_STATUS_TEST_CONFIRM=disposable
    subprocess_heavy: spawns a real installer subprocess per test — ~20s each.
        Excluded from the LOCAL default above so `pytest -q` stays a usable
        feedback loop (2h08 -> ~33min, measured 2026-08-05). CI is NOT affected:
        ci.yml passes its own `-m "not slow"` on the command line, which
        overrides addopts, so all 284 of these tests still run there.
        Run them locally with: pytest -m subprocess_heavy
