# vinhlong360 - Nginx reverse proxy for Nuxt + FastAPI

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;

upstream vl360_nuxt {
    server nuxt:3000;
}

# Agent and bot-gateway are optional during a closed launch.  Keep their DNS
# lookups request-time so Nginx can start while those services are absent.
resolver 127.0.0.11 valid=5s ipv6=off;

include /etc/nginx/vl360-maintenance/http-context.conf;

server {
    listen 80;
    server_name vinhlong360.vn www.vinhlong360.vn localhost;
    include /etc/nginx/vl360-maintenance/active-server.conf;

    set $agent_upstream http://agent:8360;
    set $bot_upstream http://bot-gateway:8361;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' http: https: ws: wss:; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:;" always;

    client_max_body_size 8m;
    proxy_cache off;

    # Nuxt is the sole public owner of root SEO documents.
    location = /robots.txt {
        proxy_pass http://vl360_nuxt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    location = /sitemap.xml {
        proxy_pass http://vl360_nuxt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    location = /sitemap-media.xml {
        proxy_pass http://vl360_nuxt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    location = /sitemap-index.xml {
        proxy_pass http://vl360_nuxt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    location ^~ /_internal/ {
        return 404;
    }

    location ~ ^/chat(?:/|$) {
        limit_req zone=chat burst=5 nodelay;
        proxy_pass $agent_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location ~ ^/events(?:/|$) {
        limit_req zone=chat burst=5 nodelay;
        proxy_pass $agent_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location ~ ^/api(?:/|$) {
        limit_req zone=api burst=20 nodelay;
        proxy_pass $agent_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/auth(?:/|$) {
        limit_req zone=api burst=5 nodelay;
        proxy_pass $agent_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin-api {
        limit_req zone=api burst=3 nodelay;
        rewrite ^ /admin break;
        proxy_pass $agent_upstream$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin-api/ {
        limit_req zone=api burst=3 nodelay;
        rewrite ^/admin-api(?<admin_rest>/.*)$ /admin$admin_rest break;
        proxy_pass $agent_upstream$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(health|analytics|feedback|welcome|reload|system|seo|weather|recommend|freshness)(?:/|$) {
        limit_req zone=api burst=10 nodelay;
        proxy_pass $agent_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/webhook(?:/|$) {
        proxy_pass $bot_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://vl360_nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
    # Without gzip_proxied, nginx does NOT compress upstream/proxied responses
    # (all /api/* JSON is proxied from the Nuxt/nitro server). Enabling it cut
    # /api/homepage from 59.4KB → 13.3KB on the wire (−78%). gzip_vary sets the
    # Vary: Accept-Encoding header for correct caching. (Perf audit 2026-07-02.)
    gzip_proxied any;
    gzip_vary on;
}
