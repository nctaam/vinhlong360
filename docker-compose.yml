services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vinhlong360
      POSTGRES_USER: vl360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vl360_dev_password}
      POSTGRES_INITDB_ARGS: "--wal-segsize=16"
    expose:
      - "5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-wal:/var/lib/postgresql/wal
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vl360 -d vinhlong360"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  agent:
    build: .
    expose:
      - "8360"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://vl360:${POSTGRES_PASSWORD:-vl360_dev_password}@postgres:5432/vinhlong360
      REDIS_URL: redis://redis:6379/0
      BIND_HOST: 0.0.0.0
    volumes:
      - ./web:/app/web
      - agent-data:/app/agent/data
      - memory-data:/app/data/memory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8360/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot-gateway:
    build: .
    command: python agent/bot_gateway.py
    expose:
      - "8361"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://vl360:${POSTGRES_PASSWORD:-vl360_dev_password}@postgres:5432/vinhlong360
      REDIS_URL: redis://redis:6379/0
      BIND_HOST: 0.0.0.0
      AGENT_URL: http://agent:8360
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8361/"]
      interval: 30s
      timeout: 10s
      retries: 3

  nuxt:
    build:
      context: .
      dockerfile: web-nuxt/Dockerfile
      args:
        BUILD_REVISION: ${BUILD_REVISION:-}
        API_BASE: http://agent:8360
    expose:
      - "3000"
    environment:
      NUXT_API_BASE: http://agent:8360
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/_internal/launch-readiness >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3

  maintenance-runtime-init:
    image: alpine:3.20
    command:
      - /bin/sh
      - -ec
      - |
        set -eu
        install -d -m 0755 /etc/nginx/vl360-maintenance
        sed 's#__OPERATOR_CIDR__#127.0.0.1/32#' /opt/vl360-maintenance-source/http-context.conf.template > /etc/nginx/vl360-maintenance/http-context.conf
        install -m 0644 /opt/vl360-maintenance-source/server-enabled.conf /etc/nginx/vl360-maintenance/server-enabled.conf
        install -m 0644 /opt/vl360-maintenance-source/server-disabled.conf /etc/nginx/vl360-maintenance/server-disabled.conf
        ln -sfn server-disabled.conf /etc/nginx/vl360-maintenance/active-server.conf
    volumes:
      - ./ops/nginx/maintenance:/opt/vl360-maintenance-source:ro
      - "/etc/nginx/vl360-maintenance:/etc/nginx/vl360-maintenance"
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/var/www/html:ro
      - ./ssl:/etc/nginx/ssl:ro
      - "/etc/nginx/vl360-maintenance:/etc/nginx/vl360-maintenance"
    depends_on:
      maintenance-runtime-init:
        condition: service_completed_successfully
      nuxt:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    expose:
      - "9090"
    volumes:
      - ./scripts/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=1GB'
    restart: unless-stopped
    depends_on:
      - agent

  grafana:
    image: grafana/grafana:latest
    expose:
      - "3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./scripts/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    restart: unless-stopped
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    expose:
      - "3100"
    volumes:
      - loki-data:/loki
      - ./scripts/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./scripts/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  pg-data:
  pg-wal:
  redis-data:
  agent-data:
  memory-data:
  prometheus-data:
  grafana-data:
  loki-data:
